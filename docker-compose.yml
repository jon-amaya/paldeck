services:
  paldeck:
    build: .
    container_name: paldeck
    restart: unless-stopped
    ports:
      # LAN-reachable, same as every other stack on this host (dockge,
      # opengist, etc.) — the LAN is the trust boundary here, not this one
      # service. The panel has no login of its own, so this assumes the LAN
      # itself is trusted; don't forward this port past the router.
      - 8080:8080
    networks:
      # Reaches each managed Palworld server's RCON/REST API by container
      # name over this shared network (internal/docker Create() attaches
      # every server Paldeck creates to it too) — not via the host's
      # loopback. Same pattern already used for spotify/mongo on this host
      # (MONGO_ENDPOINT=mongodb://mongo:27017/...) and for the palworld/
      # palworld-2 stacks themselves, which already join this network.
      # An earlier attempt used network_mode: host instead, which does fix
      # the same reachability problem, but at the cost of losing Docker's
      # automatic host-firewall exception for this container's own :8080 —
      # this approach keeps the panel a normal, simply-published bridge
      # container like everything else here.
      - palworld
    volumes:
      # Paldeck is a Docker *client* (constitution §5) — it needs the socket
      # to create/manage the sibling Palworld containers it creates. This is
      # root-equivalent host access, same tradeoff as Portainer/Watchtower;
      # acceptable here because the panel itself is admin-only via NetBird.
      - /var/run/docker.sock:/var/run/docker.sock
      - paldeck-data:/data
networks:
  palworld:
    external: true
volumes:
  paldeck-data:
    name: paldeck-data
