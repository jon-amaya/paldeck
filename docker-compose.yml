services:
  paldeck:
    build: .
    container_name: paldeck
    restart: unless-stopped
    ports:
      # LAN-reachable, same as every other stack on this host (dockge,
      # opengist, etc.) — Jon's LAN is the trust boundary here, not this
      # one service. The panel has no login of its own, so this assumes
      # the LAN itself is trusted; don't forward this port past the router.
      - 8080:8080
    volumes:
      # Paldeck is a Docker *client* (constitution §5) — it needs the socket
      # to create/manage the sibling Palworld containers it creates. This is
      # root-equivalent host access, same tradeoff as Portainer/Watchtower;
      # acceptable here because the panel itself is admin-only via NetBird.
      - /var/run/docker.sock:/var/run/docker.sock
      - paldeck-data:/data
volumes:
  paldeck-data:
    name: paldeck-data
