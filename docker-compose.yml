services:
  paldeck:
    build: .
    container_name: paldeck
    restart: unless-stopped
    # Host networking, same reason netbird-client uses it: Paldeck's own Go
    # code reaches each managed Palworld server's RCON/REST API over
    # 127.0.0.1:<host-published-port> (that's how the whole port-tracking
    # design works — see internal/palworld/palworld.go). Under normal bridge
    # networking, 127.0.0.1 inside Paldeck's container is Paldeck's own
    # loopback, not the host's, so those calls fail with connection refused
    # — confirmed live (broadcast to a real server failed exactly this way).
    # Host networking makes 127.0.0.1 actually mean the host, matching how
    # this worked when tested as a bare binary. `ports:` is meaningless
    # under host networking (the app's :8080 bind directly is the host's
    # :8080 already) so it's removed rather than left as dead config.
    network_mode: host
    volumes:
      # Paldeck is a Docker *client* (constitution §5) — it needs the socket
      # to create/manage the sibling Palworld containers it creates. This is
      # root-equivalent host access, same tradeoff as Portainer/Watchtower;
      # acceptable here because the panel itself is admin-only via NetBird.
      - /var/run/docker.sock:/var/run/docker.sock
      - paldeck-data:/data
volumes:
  paldeck-data:
    name: paldeck-data
